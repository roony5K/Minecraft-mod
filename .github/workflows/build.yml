name: Build Fabric Mod
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src/main/java/com/autotrade/mixin src/main/resources/assets/autotrade/lang
          mv -n AutoTradeClient.java src/main/java/com/autotrade/ || true
          mv -n MerchantScreenAccessor.java MerchantScreenMixin.java src/main/java/com/autotrade/mixin/ || true
          mv -n fabric.mod.json autotrade.mixins.json src/main/resources/ || true
          mv -n en_us.json src/main/resources/assets/autotrade/lang/ || true
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: autotrade-fabric-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            
